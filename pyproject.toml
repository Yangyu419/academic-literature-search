[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-literature-search"
version = "0.1.0"
description = "A lawful, multi-source academic literature search Agent Skill with Excel export."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Academic Literature Search contributors" }]
dependencies = [
  "openpyxl>=3.1,<4",
  "requests>=2.31,<3",
]

[project.scripts]
literature-search = "literature_finder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

